# nginx: bloque de ejemplo para la landing VISIÓN. Ajustar server_name, certificados y root.
server {
    listen 80;
    server_name vision.ejemplo.savills.es;
    return 301 https://$host$request_uri;                       # HDR-05
}

server {
    listen 443 ssl http2;
    server_name vision.ejemplo.savills.es;
    # ssl_certificate     /ruta/al/certificado.pem;
    # ssl_certificate_key /ruta/a/la/clave.pem;

    root  /var/www/vision-landing;
    index index.html;

    server_tokens off;                                           # INFO-01 (oculta la versión)

    types { image/avif avif; }                                   # por si mime.types no lo trae

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'sha256-CwWbBf7jQqvh/bJnN8zix/pIAcILUmqMV5j4DXi/Lmo='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    location = /index.html { add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'sha256-CwWbBf7jQqvh/bJnN8zix/pIAcILUmqMV5j4DXi/Lmo='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always; }

    location ~* \.(?:avif|jpg|png|svg|mp4|css|js)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # error_page 404 /errores/404.html;                        # página de error corporativa genérica (INFO-01)
}
